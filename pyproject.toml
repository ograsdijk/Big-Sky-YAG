[project]
name = "big-sky-yag"
version = "0.3.0"
description = "Python interface for a Big Sky YAG Laser."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["laser", "serial", "rs-485", "instrument-control"]
authors = [
    { name = "ograsdijk", email = "o.grasdijk@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "pyserial>=3.5",
]

[project.urls]
Repository = "https://github.com/ograsdijk/Big-Sky-YAG"
Documentation = "https://github.com/ograsdijk/Big-Sky-YAG#readme"
Issues = "https://github.com/ograsdijk/Big-Sky-YAG/issues"

[dependency-groups]
dev = [
    "build>=1.2.2.post1,<2",
    "mypy>=1.14.1,<1.15",
    "pytest>=8.3.5,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.12.0",
    "twine>=6.2.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["big_sky_yag"]

[tool.hatch.build.targets.sdist]
include = [
    "/big_sky_yag",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
    "/big_sky_bss_rs485_command_reference.md",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
files = ["big_sky_yag", "tests"]
strict = true

[[tool.mypy.overrides]]
module = "serial"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "--cov=big_sky_yag",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
